name: Local checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --prefix app/web --ignore-scripts
      - run: npm run check --prefix app/web
      - run: npm audit --prefix app/web --omit=dev --audit-level=high
      - run: python scripts/check_frontend_audit.py
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.17.0'
          terraform_wrapper: false
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: ruff check app simulator scripts tests
      - run: ruff format --check app simulator scripts tests
      - run: pytest -q
      - name: Dashboard browser checks with mocked API
        run: |
          python -m pip install --require-hashes -r requirements-browser.lock
          python -m playwright install --with-deps chromium
          npm run build --prefix app/web
          python scripts/check_dashboard_browser.py
      - run: pip-audit --disable-pip --no-deps -r requirements.lock
      - run: python scripts/package.py
      - name: Terraform format, validation and mocked security contracts
        shell: bash
        run: |
          terraform fmt -check -recursive infra
          for root in infra/bootstrap infra/environments/dev infra/environments/demo infra/modules/platform; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
          done
          terraform -chdir=infra/bootstrap test
          terraform -chdir=infra/modules/platform test
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: .git,.venv,.local,artifacts,docs,app/web/node_modules
          trivyignores: .trivyignore.yaml
