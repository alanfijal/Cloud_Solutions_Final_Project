# Reviewed cost/security tradeoffs for the disposable university demo.
# Remaining LOW/MEDIUM findings stay visible in the full report.
misconfigurations:
  - id: AWS-0011
    paths:
      - infra/modules/platform/cloudfront.tf
    statement: 'The bounded university demo omits paid WAF and Shield Advanced. Private OAC origin, HTTPS/security headers, operator authentication and API throttling apply; these are not DDoS spending caps.'
    expired_at: 2027-05-17
  - id: AWS-0132
    paths:
      - infra/bootstrap/s3.tf
      - infra/modules/platform/s3.tf
    statement: 'S3 uses SSE-S3, private access and HTTPS. Customer-managed keys are explicitly excluded from this disposable demo.'
    expired_at: 2027-05-17
  - id: AWS-0136
    paths:
      - infra/modules/platform/sns.tf
    statement: 'Staff/manager topics use AWS-managed SNS keys. Operations alarms contain resource metadata only; CloudWatch requires a customer-managed key for encrypted-topic delivery.'
    expired_at: 2027-05-17
